<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机抽取学生</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 36px 18px;

  font-family:
    "HarmonyOS Sans",
    "HarmonyOS Sans SC",
    "鸿蒙黑体",
    "PingFang SC",
    "Microsoft YaHei",
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color: #26324a;

  background:
    linear-gradient(
      135deg,
      #f5f9ff 0%,
      #eef6ff 30%,
      #f7f0ff 62%,
      #fff5fa 100%
    );

  background-size: 220% 220%;
  animation: bgShift 26s ease-in-out infinite;

  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

@keyframes bgShift {
  0%, 100% {
    background-position: 0% 50%;
  }

  50% {
    background-position: 100% 50%;
  }
}

/* ---------- 浅色光斑 ---------- */

.blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(95px);
  pointer-events: none;
  z-index: 0;
}

.blob.b1 {
  width: 460px;
  height: 460px;
  background: #9bc7ff;
  opacity: .30;
  top: -170px;
  left: -150px;
}

.blob.b2 {
  width: 400px;
  height: 400px;
  background: #c7a8ff;
  opacity: .26;
  bottom: -150px;
  right: -130px;
}

.blob.b3 {
  width: 320px;
  height: 320px;
  background: #ffb6d5;
  opacity: .22;
  top: 44%;
  right: 8%;
}

/* ---------- 主卡片 ---------- */

.app {
  position: relative;
  z-index: 1;

  width: 100%;
  max-width: 820px;

  padding: 34px 34px 30px;

  border-radius: 28px;

  background: rgba(255, 255, 255, .68);

  backdrop-filter: blur(26px) saturate(160%);
  -webkit-backdrop-filter: blur(26px) saturate(160%);

  border: 1px solid rgba(150, 170, 205, .25);

  box-shadow:
    0 34px 80px -34px rgba(70, 90, 130, .22),
    inset 0 1px 0 rgba(255, 255, 255, .90),
    inset 0 -1px 0 rgba(110, 130, 170, .08);
}

/* 顶部高光 */

.app::before {
  content: "";
  position: absolute;
  inset: 0;

  border-radius: inherit;
  pointer-events: none;

  background:
    linear-gradient(
      180deg,
      rgba(255, 255, 255, .72) 0%,
      rgba(255, 255, 255, 0) 32%
    );
}

/* ---------- 标题 ---------- */

.app-header h1 {
  margin: 0;

  font-size: 27px;
  font-weight: 800;
  letter-spacing: 1.5px;

  background:
    linear-gradient(
      120deg,
      #557eea,
      #9a70e8 55%,
      #e67da8
    );

  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.app-header p {
  margin: 8px 0 0;

  font-size: 13.5px;
  letter-spacing: .6px;

  color: #71809b;
}

/* ---------- 上传卡片 ---------- */

.upload-card {
  position: relative;

  display: flex;
  align-items: center;
  gap: 16px;

  margin-top: 24px;
  padding: 20px 22px;

  border-radius: 20px;
  cursor: pointer;

  background: rgba(255, 255, 255, .58);

  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);

  border: 1.5px dashed rgba(115, 145, 195, .38);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .85);

  transition:
    background .25s,
    border-color .25s,
    transform .25s,
    box-shadow .25s;

  overflow: hidden;
}

.upload-card:hover {
  background: rgba(255, 255, 255, .86);

  border-color: rgba(100, 145, 235, .58);

  transform: translateY(-2px);

  box-shadow:
    0 18px 36px -22px rgba(80, 105, 150, .22),
    inset 0 1px 0 rgba(255, 255, 255, .95);
}

.upload-card.ok {
  border-style: solid;
  border-color: rgba(55, 185, 145, .45);
  background: rgba(60, 200, 150, .10);
}

.upload-card.err {
  border-style: solid;
  border-color: rgba(235, 110, 135, .48);
  background: rgba(255, 90, 120, .09);
}

.upload-card.shake {
  animation: cardShake .5s ease 2;
}

@keyframes cardShake {
  0%, 100% {
    transform: translateX(0);
  }

  20% {
    transform: translateX(-8px);
  }

  40% {
    transform: translateX(8px);
  }

  60% {
    transform: translateX(-6px);
  }

  80% {
    transform: translateX(6px);
  }
}

.upload-input {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  opacity: 0;

  cursor: pointer;

  z-index: 2;

  font-size: 0;
}

/* ---------- 上传图标 ---------- */

.upload-icon {
  flex: 0 0 auto;

  width: 50px;
  height: 50px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      rgba(100, 145, 245, .18),
      rgba(190, 140, 255, .16)
    );

  color: #5678d8;

  border: 1px solid rgba(120, 150, 210, .20);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .85);

  pointer-events: none;
}

.upload-card.ok .upload-icon {
  background:
    linear-gradient(
      135deg,
      rgba(80, 220, 170, .18),
      rgba(120, 200, 255, .16)
    );

  color: #159c72;
}

.upload-card.err .upload-icon {
  background:
    linear-gradient(
      135deg,
      rgba(255, 130, 150, .18),
      rgba(255, 190, 120, .16)
    );

  color: #d95573;
}

.upload-icon svg {
  width: 25px;
  height: 25px;
}

/* ---------- 上传文字 ---------- */

.upload-text {
  flex: 1 1 auto;
  min-width: 0;

  display: flex;
  flex-direction: column;
  gap: 5px;

  pointer-events: none;
}

.upload-text strong {
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: .4px;

  color: #34415c;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.upload-text span {
  font-size: 12.5px;
  line-height: 1.5;

  color: #71809b;

  letter-spacing: .3px;
}

.upload-text span b {
  color: #5c6c88;
  font-weight: 700;
}

/* ---------- 控制区 ---------- */

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;

  margin-top: 22px;
}

/* ---------- 人数选择 ---------- */

.count-box {
  display: flex;
  align-items: center;
  gap: 6px;

  padding: 7px;

  border-radius: 18px;

  background: rgba(255, 255, 255, .62);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 1px solid rgba(145, 165, 200, .25);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .85);

  transition:
    box-shadow .25s,
    border-color .25s;
}

.count-box:focus-within {
  border-color: rgba(100, 145, 235, .58);

  box-shadow:
    0 0 0 4px rgba(100, 145, 235, .12),
    inset 0 1px 0 rgba(255, 255, 255, .90);
}

.step-btn {
  flex: 0 0 auto;

  width: 44px;
  height: 44px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-family: inherit;
  font-size: 24px;
  font-weight: 700;
  line-height: 1;

  color: #51658f;

  border: none;
  border-radius: 13px;

  cursor: pointer;

  background:
    linear-gradient(
      135deg,
      rgba(255, 255, 255, .90),
      rgba(235, 242, 255, .72)
    );

  border: 1px solid rgba(130, 155, 200, .20);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .95),
    0 6px 14px -10px rgba(80, 100, 145, .20);

  transition:
    transform .18s,
    background .2s,
    box-shadow .2s,
    color .2s;

  user-select: none;

  -webkit-tap-highlight-color: transparent;
}

.step-btn:hover:not(:disabled) {
  background: rgba(255, 255, 255, .98);

  color: #29416d;

  transform: translateY(-1px);

  box-shadow:
    0 10px 20px -12px rgba(80, 100, 145, .20),
    inset 0 1px 0 rgba(255, 255, 255, .98);
}

.step-btn:active:not(:disabled) {
  transform: scale(.93);
}

.step-btn:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.count-mid {
  display: flex;
  flex-direction: column;
  align-items: center;

  min-width: 74px;
}

#drawCount {
  width: 74px;

  padding: 0;

  border: none;
  outline: none;

  background: transparent;

  font-family: inherit;

  font-size: 24px;
  font-weight: 800;

  text-align: center;

  color: #40547e;

  -moz-appearance: textfield;
  appearance: textfield;
}

#drawCount::-webkit-outer-spin-button,
#drawCount::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.count-mid small {
  font-size: 11px;
  letter-spacing: .5px;

  color: #8190a8;

  margin-top: -2px;
}

/* ---------- 开始抽取按钮 ---------- */

.btn-draw {
  flex: 1 1 230px;

  min-height: 58px;

  padding: 16px 24px;

  font-family: inherit;

  font-size: 17px;
  font-weight: 700;

  letter-spacing: 5px;
  text-indent: 5px;

  color: #fff;

  border: none;
  border-radius: 18px;

  cursor: pointer;

  background:
    linear-gradient(
      120deg,
      #638af0 0%,
      #9975e8 48%,
      #e987b1 100%
    );

  background-size: 200% 200%;

  box-shadow:
    0 20px 40px -16px rgba(110, 125, 220, .45),
    inset 0 1px 0 rgba(255, 255, 255, .45);

  transition:
    transform .22s,
    box-shadow .22s,
    background-position .5s,
    opacity .2s;
}

.btn-draw:hover:not(:disabled) {
  background-position: 100% 50%;

  transform: translateY(-2px);

  box-shadow:
    0 26px 48px -18px rgba(110, 125, 220, .55),
    inset 0 1px 0 rgba(255, 255, 255, .55);
}

.btn-draw:active:not(:disabled) {
  transform: translateY(0) scale(.995);
}

.btn-draw:disabled {
  cursor: not-allowed;
  opacity: .45;
  box-shadow: none;

  background:
    linear-gradient(
      120deg,
      #aab5ce,
      #b2a6c9
    );
}

/* ---------- 抽取舞台 ---------- */

.stage {
  position: fixed;
  inset: 0;

  z-index: 80;

  display: flex;

  align-items: center;
  justify-content: center;

  flex-direction: column;

  background: rgba(244, 248, 255, .84);

  backdrop-filter: blur(40px) saturate(150%);
  -webkit-backdrop-filter: blur(40px) saturate(150%);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity .4s,
    visibility .4s;
}

.stage.show {
  opacity: 1;
  visibility: visible;
}

.stage::before {
  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: min(1100px, 130vw);
  height: min(1100px, 130vw);

  border-radius: 50%;

  transform:
    translate(-50%, -50%)
    scale(.6);

  background:
    radial-gradient(
      circle,
      rgba(110, 160, 255, .20) 0%,
      rgba(190, 135, 255, .12) 45%,
      rgba(255, 255, 255, 0) 70%
    );

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .9s .1s,
    transform 1.8s cubic-bezier(.16, 1, .3, 1) .1s;
}

.stage.show::before {
  opacity: 1;

  transform:
    translate(-50%, -50%)
    scale(1);
}

/* ---------- 卡片区域 ---------- */

.board {
  position: relative;

  z-index: 2;

  display: flex;

  flex-wrap: wrap;

  justify-content: center;
  align-content: center;

  margin-bottom: 40px;
}

.draw-card {
  flex: 0 0 auto;

  display: flex;

  align-items: center;
  justify-content: center;

  border-radius: 22px;

  font-weight: 800;

  letter-spacing: .02em;

  white-space: nowrap;
  overflow: hidden;

  padding: 0 10px;

  user-select: none;

  color: #75839d;

  background: rgba(232, 239, 250, .82);

  border: 1px solid rgba(135, 160, 200, .22);

  box-shadow:
    0 10px 26px -18px rgba(70, 95, 140, .20),
    inset 0 1px 0 rgba(255, 255, 255, .80);

  transform: scale(1);

  transition:
    color .35s,
    background .45s,
    border-color .45s,
    box-shadow .45s;

  will-change: transform;
}

.draw-card.settled {
  color: #293753;

  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #eef6ff 48%,
      #fbf1ff 100%
    );

  border-color: rgba(170, 195, 235, .9);

  box-shadow:
    0 26px 54px -22px rgba(100, 135, 230, .32),
    0 0 0 1px rgba(255, 255, 255, .95) inset,
    0 0 70px -14px rgba(150, 170, 255, .38);
}

.draw-card.popped {
  animation:
    cardPop .78s cubic-bezier(.18, 1.3, .42, 1) forwards;
}

@keyframes cardPop {
  0% {
    transform: scale(1);
  }

  35% {
    transform: scale(1.16);
  }

  100% {
    transform: scale(1.03);
  }
}

/* ---------- 底部按钮 ---------- */

.stage-actions {
  position: relative;

  z-index: 3;

  display: flex;

  gap: 16px;

  align-items: center;
  justify-content: center;

  opacity: 0;

  transform: translateY(16px);

  pointer-events: none;

  transition:
    opacity .45s ease,
    transform .45s ease;
}

.stage-actions.show {
  opacity: 1;

  transform: translateY(0);

  pointer-events: auto;
}

.stage-btn {
  font-family: inherit;

  font-size: 16px;
  font-weight: 700;

  letter-spacing: 2px;

  padding: 14px 34px;

  border-radius: 16px;

  cursor: pointer;

  border: none;

  transition:
    transform .2s ease,
    box-shadow .2s ease,
    background-position .5s ease,
    background .2s,
    color .2s;

  white-space: nowrap;
}

.stage-btn.back {
  color: #42547a;

  background: rgba(255, 255, 255, .72);

  backdrop-filter: blur(14px) saturate(150%);
  -webkit-backdrop-filter: blur(14px) saturate(150%);

  border: 1.5px solid rgba(125, 150, 195, .30);

  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .95),
    0 14px 30px -18px rgba(75, 95, 135, .20);
}

.stage-btn.back:hover {
  background: rgba(255, 255, 255, .95);

  color: #29416d;

  transform: translateY(-2px);

  box-shadow:
    0 18px 36px -18px rgba(75, 95, 135, .24),
    inset 0 1px 0 rgba(255, 255, 255, .98);
}

.stage-btn.again {
  color: #fff;

  background:
    linear-gradient(
      120deg,
      #638af0 0%,
      #9975e8 48%,
      #e987b1 100%
    );

  background-size: 200% 200%;

  box-shadow:
    0 16px 34px -14px rgba(120, 120, 240, .45),
    inset 0 1px 0 rgba(255, 255, 255, .45);
}

.stage-btn.again:hover {
  background-position: 100% 50%;

  transform: translateY(-2px);

  box-shadow:
    0 22px 40px -14px rgba(120, 120, 240, .55),
    inset 0 1px 0 rgba(255, 255, 255, .55);
}

.stage-btn:active {
  transform: translateY(0) scale(.97);
}

/* ---------- Toast ---------- */

.toast {
  position: fixed;

  left: 50%;
  bottom: 40px;

  z-index: 999;

  max-width: 86vw;

  text-align: center;

  transform:
    translate(-50%, 20px);

  padding: 13px 24px;

  border-radius: 15px;

  font-size: 14px;
  line-height: 1.55;

  letter-spacing: .4px;

  color: #33415c;

  background: rgba(255, 255, 255, .92);

  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);

  border: 1px solid rgba(145, 165, 200, .25);

  box-shadow:
    0 22px 44px -18px rgba(70, 90, 130, .22),
    inset 0 1px 0 rgba(255, 255, 255, .90);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .3s,
    transform .3s;
}

.toast.show {
  opacity: 1;

  transform:
    translate(-50%, 0);
}

/* ---------- 移动端 ---------- */

@media (max-width: 620px) {

  body {
    padding: 18px 12px;
  }

  .app {
    padding: 26px 20px 24px;
    border-radius: 24px;
  }

  .app-header h1 {
    font-size: 22px;
  }

  .count-box {
    flex: 1 1 100%;
    justify-content: center;
  }

  .btn-draw {
    flex: 1 1 100%;

    font-size: 16px;

    letter-spacing: 3px;
    text-indent: 3px;

    min-height: 52px;
  }

  .draw-card {
    border-radius: 16px;
  }

  .board {
    margin-bottom: 30px;
  }

  .stage-actions {
    gap: 12px;
  }

  .stage-btn {
    font-size: 14.5px;

    padding: 12px 26px;

    letter-spacing: 1.5px;
  }
}
</style>
</head>

<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<main class="app">

  <header class="app-header">
    <h1 id="appTitle">随机抽取学生</h1>
    <p id="appSubtitle">点击下方卡片载入名单 · 单次最多 20 人</p>
  </header>

  <div class="upload-card" id="uploadCard">

    <input
      type="file"
      id="pickInput"
      class="upload-input"
      accept=".txt,text/plain"
    >

    <div class="upload-icon">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.9"
        stroke-linecap="round"
        stroke-linejoin="round"
      >

        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

        <polyline points="14 2 14 8 20 8"/>

        <line x1="9" y1="13" x2="15" y2="13"/>

        <line x1="9" y1="17" x2="13" y2="17"/>

      </svg>

    </div>

    <div class="upload-text">

      <strong id="uploadTitle">
        点击载入名单文件
      </strong>

      <span id="uploadSub">
        请选择同目录下的 <b>name.txt</b>（每行一个名字）
      </span>

    </div>

  </div>

  <section class="controls">

    <div class="count-box">

      <button
        class="step-btn"
        id="minusBtn"
        type="button"
        aria-label="减少人数"
      >
        −
      </button>

      <div class="count-mid">

        <input
          id="drawCount"
          type="number"
          min="1"
          max="20"
          value="1"
          inputmode="numeric"
          aria-label="抽取人数"
        >

        <small>
          抽取人数
        </small>

      </div>

      <button
        class="step-btn"
        id="plusBtn"
        type="button"
        aria-label="增加人数"
      >
        +
      </button>

    </div>

    <button
      class="btn-draw"
      id="drawBtn"
      type="button"
    >
      开 始 抽 取
    </button>

  </section>

</main>

<div class="stage" id="stage">

  <div class="board" id="board"></div>

  <div class="stage-actions" id="stageActions">

    <button
      class="stage-btn back"
      id="backBtn"
      type="button"
    >
      返 回
    </button>

    <button
      class="stage-btn again"
      id="againBtn"
      type="button"
    >
      再 抽 一 次
    </button>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

(function () {

  "use strict";

  var MAX_DRAW = 20;

  /* ================= URL 参数解析 ================= */

  var urlParams =
    new URLSearchParams(location.search);

  var classId =
    urlParams.get("class");

  var targetFile =
    classId ? classId + "ban.txt" : "name.txt";

  var classLabel =
    classId ? classId + "班" : "";


  /* ================= DOM 引用 ================= */

  var appTitle =
    document.getElementById("appTitle");

  var appSubtitle =
    document.getElementById("appSubtitle");

  var uploadCard =
    document.getElementById("uploadCard");

  var pickInput =
    document.getElementById("pickInput");

  var uploadTitle =
    document.getElementById("uploadTitle");

  var uploadSub =
    document.getElementById("uploadSub");

  var minusBtn =
    document.getElementById("minusBtn");

  var plusBtn =
    document.getElementById("plusBtn");

  var drawCountEl =
    document.getElementById("drawCount");

  var drawBtn =
    document.getElementById("drawBtn");

  var stage =
    document.getElementById("stage");

  var board =
    document.getElementById("board");

  var stageActions =
    document.getElementById("stageActions");

  var backBtn =
    document.getElementById("backBtn");

  var againBtn =
    document.getElementById("againBtn");

  var toastEl =
    document.getElementById("toast");

  var students = [];

  var drawing = false;

  var canClose = false;

  var lastDrawCount = 1;


  /* ================= 根据班级更新页面文案 ================= */

  if (classLabel) {

    document.title =
      classLabel + " · 随机抽取学生";

    if (appTitle)
      appTitle.textContent =
        classLabel + " 随机抽取学生";

    if (appSubtitle)
      appSubtitle.textContent =
        "点击下方卡片载入名单 · 单次最多 " +
        MAX_DRAW +
        " 人";

  }

  /* 更新上传提示里的文件名 */

  if (uploadSub) {

    uploadSub.innerHTML =
      "请选择同目录下的 <b>" +
      targetFile +
      "</b>（每行一个名字）";

  }


  /* ================= 音效 ================= */

  var audioCtx = null;

  var lastTickAt = 0;


  function ensureAudio() {

    try {

      if (!audioCtx) {

        var AC =
          window.AudioContext ||
          window.webkitAudioContext;

        if (!AC) return null;

        audioCtx = new AC();

      }

      if (audioCtx.state === "suspended") {

        audioCtx.resume().catch(
          function () {}
        );

      }

      return audioCtx;

    } catch (e) {

      return null;

    }

  }


  function playTick() {

    try {

      var ctx = audioCtx;

      if (!ctx || ctx.state !== "running")
        return;

      var now = ctx.currentTime;

      if (now - lastTickAt < 0.028)
        return;

      lastTickAt = now;

      var osc =
        ctx.createOscillator();

      var gain =
        ctx.createGain();

      osc.type = "triangle";

      osc.frequency.setValueAtTime(
        1750,
        now
      );

      osc.frequency.exponentialRampToValueAtTime(
        1200,
        now + 0.04
      );

      gain.gain.setValueAtTime(
        0,
        now
      );

      gain.gain.linearRampToValueAtTime(
        0.030,
        now + 0.004
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.055
      );

      osc.connect(gain);

      gain.connect(ctx.destination);

      osc.start(now);

      osc.stop(now + 0.06);

    } catch (e) {}

  }


  function playFinalChord() {

    try {

      var ctx = audioCtx;

      if (!ctx || ctx.state !== "running")
        return;

      var now = ctx.currentTime;

      var notes = [

        {
          f: 659.25,
          t: 0.000,
          d: 0.55
        },

        {
          f: 830.61,
          t: 0.055,
          d: 0.65
        },

        {
          f: 1046.50,
          t: 0.110,
          d: 0.75
        },

        {
          f: 1318.51,
          t: 0.165,
          d: 0.95
        }

      ];

      notes.forEach(function (note) {

        var osc =
          ctx.createOscillator();

        var gain =
          ctx.createGain();

        var t0 =
          now + note.t;

        osc.type = "sine";

        osc.frequency.setValueAtTime(
          note.f,
          t0
        );

        gain.gain.setValueAtTime(
          0,
          t0
        );

        gain.gain.linearRampToValueAtTime(
          0.09,
          t0 + 0.012
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          t0 + note.d
        );

        osc.connect(gain);

        gain.connect(ctx.destination);

        osc.start(t0);

        osc.stop(
          t0 + note.d + 0.05
        );

      });

    } catch (e) {}

  }


  /* ================= 工具 ================= */

  function toast(msg) {

    toastEl.textContent = msg;

    toastEl.classList.add("show");

    clearTimeout(toast._t);

    toast._t =
      setTimeout(
        function () {
          toastEl.classList.remove("show");
        },
        3200
      );

  }


  function maxAllowed() {

    return students.length
      ? Math.min(
          MAX_DRAW,
          students.length
        )
      : MAX_DRAW;

  }


  function clampCount(v) {

    var n =
      parseInt(v, 10);

    if (!isFinite(n))
      n = 1;

    return Math.min(
      maxAllowed(),
      Math.max(1, n)
    );

  }


  function decodeBuffer(buffer) {

    var text = "";

    try {

      text =
        new TextDecoder(
          "utf-8"
        ).decode(buffer);

    } catch (e) {

      text = "";

    }

    if (
      text.indexOf("\uFFFD") !== -1
    ) {

      try {

        var gbk =
          new TextDecoder(
            "gbk"
          ).decode(buffer);

        if (
          gbk.indexOf("\uFFFD") === -1
        )
          return gbk;

      } catch (e) {}

    }

    return text;

  }


  function parseNames(text) {

    if (!text)
      return [];

    return text

      .replace(
        /^\uFEFF/,
        ""
      )

      .split(
        /[\r\n,，、;；\t|]+/
      )

      .map(
        function (s) {
          return s.trim();
        }
      )

      .filter(
        function (s) {
          return s.length > 0;
        }
      );

  }


  function sample(arr, n) {

    var a =
      arr.slice();

    for (
      var i = a.length - 1;
      i > 0;
      i--
    ) {

      var j =
        Math.floor(
          Math.random() * (i + 1)
        );

      var t = a[i];

      a[i] = a[j];

      a[j] = t;

    }

    return a.slice(0, n);

  }


  /* ================= 文件处理 ================= */

  function handleFile(file) {

    uploadCard.classList.remove(
      "ok",
      "err",
      "shake"
    );

    uploadTitle.textContent =
      "正在读取 " +
      file.name +
      " …";

    uploadSub.textContent =
      "请稍候，正在解析名单内容";

    var reader =
      new FileReader();

    reader.onload =
      function (e) {

        try {
          pickInput.value = "";
        } catch (err) {}

        try {

          var buffer =
            e.target.result;

          var text =
            decodeBuffer(buffer);

          var names =
            parseNames(text);

          if (!names.length) {

            uploadCard.classList.add(
              "err"
            );

            uploadTitle.textContent =
              "文件中没有解析到名字";

            uploadSub.textContent =
              "请确认文件每行包含一个学生姓名";

            toast(
              "文件内容为空或格式不正确"
            );

            return;

          }

          onNamesLoaded(
            names,
            file.name
          );

        } catch (err) {

          uploadCard.classList.add(
            "err"
          );

          uploadTitle.textContent =
            "处理文件出错";

          uploadSub.textContent =
            err.message ||
            "未知错误";

          toast(
            "处理出错：" +
            (
              err.message ||
              err
            )
          );

        }

      };


    reader.onerror =
      function () {

        try {
          pickInput.value = "";
        } catch (err) {}

        uploadCard.classList.add(
          "err"
        );

        uploadTitle.textContent =
          "读取文件失败";

        uploadSub.textContent =
          "请重新选择文件";

        toast(
          "文件读取失败，请重试"
        );

      };


    try {

      reader.readAsArrayBuffer(
        file
      );

    } catch (err) {

      try {
        pickInput.value = "";
      } catch (e2) {}

      uploadCard.classList.add(
        "err"
      );

      uploadTitle.textContent =
        "无法读取文件";

      uploadSub.textContent =
        err.message || "";

      toast(
        "无法读取文件：" +
        (
          err.message ||
          err
        )
      );

    }

  }


  function onNamesLoaded(
    names,
    fileName
  ) {

    students = names;

    var maxN =
      Math.min(
        MAX_DRAW,
        names.length
      );

    uploadCard.classList.remove(
      "err",
      "shake"
    );

    uploadCard.classList.add(
      "ok"
    );

    uploadTitle.textContent =
      "✓ 已载入 " +
      names.length +
      " 名学生";

    uploadSub.innerHTML =
      "来源：<b>" +
      fileName +
      "</b> · 单次最多 <b>" +
      maxN +
      "</b> 人 · 点击可更换名单";

    drawCountEl.value =
      clampCount(
        drawCountEl.value
      );

    syncCountUI();

    toast(
      "名单载入成功，共 " +
      names.length +
      " 名学生"
    );

  }


  /* ================= 人数控件 ================= */

  function syncCountUI() {

    var max =
      maxAllowed();

    drawCountEl.max =
      max;

    var cur =
      clampCount(
        drawCountEl.value
      );

    drawCountEl.value =
      cur;

    var lock =
      drawing;

    minusBtn.disabled =
      lock || cur <= 1;

    plusBtn.disabled =
      lock ||
      (
        students.length > 0 &&
        cur >= max
      );

    drawCountEl.disabled =
      lock;

  }


  function stepCount(delta) {

    if (drawing)
      return;

    drawCountEl.value =
      clampCount(
        clampCount(
          drawCountEl.value
        ) + delta
      );

    syncCountUI();

  }


  minusBtn.addEventListener(
    "click",
    function () {
      stepCount(-1);
    }
  );

  plusBtn.addEventListener(
    "click",
    function () {
      stepCount(1);
    }
  );


  drawCountEl.addEventListener(
    "input",
    function () {

      this.value =
        this.value
          .replace(/[^\d]/g, "")
          .slice(0, 2);

    }
  );


  drawCountEl.addEventListener(
    "blur",
    function () {

      this.value =
        clampCount(
          this.value
        );

      syncCountUI();

    }
  );


  drawCountEl.addEventListener(
    "keydown",
    function (e) {

      if (e.key === "Enter") {

        this.value =
          clampCount(
            this.value
          );

        syncCountUI();

        startDraw();

      } else if (
        e.key === "ArrowUp"
      ) {

        e.preventDefault();

        stepCount(1);

      } else if (
        e.key === "ArrowDown"
      ) {

        e.preventDefault();

        stepCount(-1);

      }

    }
  );


  /* ================= 文件选择 ================= */

  pickInput.addEventListener(
    "change",
    function (ev) {

      var file =
        ev.target.files &&
        ev.target.files[0];

      if (file)
        handleFile(file);

    }
  );


  /* ================= 布局 ================= */

  function computeLayout(
    n,
    picks
  ) {

    var availW =
      Math.min(
        window.innerWidth * 0.90,
        960
      );

    var availH =
      Math.min(
        window.innerHeight * 0.56,
        540
      );

    var cols;

    if (n === 1)
      cols = 1;

    else if (n === 2)
      cols = 2;

    else if (n === 3)
      cols = 3;

    else if (n === 4)
      cols = 2;

    else if (n === 5)
      cols = 3;

    else if (n === 6)
      cols = 3;

    else if (n === 7)
      cols = 4;

    else if (n === 8)
      cols = 4;

    else if (n === 9)
      cols = 3;

    else if (n <= 16)
      cols = 4;

    else
      cols = 5;


    var gap;

    if (n === 1)
      gap = 0;

    else if (cols === 2)
      gap = 32;

    else if (cols === 3)
      gap = 26;

    else if (cols === 4)
      gap = 20;

    else
      gap = 16;


    var cardW;

    if (n === 1)

      cardW =
        Math.min(
          availW,
          540
        );

    else

      cardW =
        (
          availW -
          gap * (cols - 1)
        ) / cols;

    cardW =
      Math.min(
        cardW,
        340
      );

    cardW =
      Math.max(
        cardW,
        76
      );


    var rows =
      Math.ceil(
        n / cols
      );

    var cardH;

    if (n === 1)

      cardH =
        Math.min(
          availH,
          220
        );

    else

      cardH =
        (
          availH -
          gap * (rows - 1)
        ) / rows;

    cardH =
      Math.min(
        cardH,
        cardW * 0.60
      );

    cardH =
      Math.min(
        cardH,
        200
      );

    cardH =
      Math.max(
        cardH,
        64
      );


    var maxLen = 1;

    for (
      var i = 0;
      i < picks.length;
      i++
    ) {

      if (
        picks[i].length >
        maxLen
      )

        maxLen =
          picks[i].length;

    }


    var fontSize =
      Math.min(
        (cardW * 0.76) /
          maxLen,

        cardH * 0.50,

        110
      );

    fontSize =
      Math.max(
        fontSize,
        15
      );


    return {

      cols: cols,

      gap: gap,

      cardW: cardW,

      cardH: cardH,

      fontSize: fontSize

    };

  }


  /* ================= 抽取 ================= */

  function startDraw(
    countOverride
  ) {

    if (drawing)
      return;


    if (!students.length) {

      toast(
        "请先点击上方卡片载入名单文件"
      );

      uploadCard.classList.remove(
        "shake"
      );

      void uploadCard.offsetWidth;

      uploadCard.classList.add(
        "shake"
      );

      setTimeout(
        function () {

          uploadCard.classList.remove(
            "shake"
          );

        },
        1100
      );

      return;

    }


    try {

      var n;

      if (
        typeof countOverride ===
        "number"
      ) {

        n =
          Math.min(
            maxAllowed(),
            Math.max(
              1,
              countOverride
            )
          );

      } else {

        n =
          clampCount(
            drawCountEl.value
          );

      }


      drawCountEl.value =
        n;

      lastDrawCount =
        n;


      ensureAudio();


      drawing = true;

      canClose = false;

      stageActions.classList.remove(
        "show"
      );

      drawBtn.disabled =
        true;

      drawBtn.textContent =
        "抽 取 中 …";

      syncCountUI();


      var picks =
        sample(
          students,
          n
        );

      var layout =
        computeLayout(
          n,
          picks
        );


      board.innerHTML = "";


      var boardW =
        layout.cols *
          layout.cardW +
        (layout.cols - 1) *
          layout.gap;


      board.style.width =
        boardW + "px";

      board.style.gap =
        layout.gap + "px";


      var cards = [];


      for (
        var i = 0;
        i < n;
        i++
      ) {

        var card =
          document.createElement(
            "div"
          );

        card.className =
          "draw-card";

        card.style.width =
          layout.cardW + "px";

        card.style.height =
          layout.cardH + "px";

        card.style.fontSize =
          layout.fontSize + "px";

        card.textContent =
          students[
            Math.floor(
              Math.random() *
              students.length
            )
          ];

        board.appendChild(
          card
        );

        cards.push(
          card
        );

      }


      stage.classList.add(
        "show"
      );


      var switchInterval = 68;

      var rollDuration =
        Math.max(
          900,
          1300 - n * 20
        );

      var popDuration = 800;


      var startTime =
        performance.now();

      var lastSwitch = 0;

      var settledAll = false;

      var actionsShown = false;


      function frame(now) {

        try {

          var elapsed =
            now - startTime;


          if (!settledAll) {

            if (
              elapsed >=
              rollDuration
            ) {

              settledAll = true;


              for (
                var i2 = 0;
                i2 < n;
                i2++
              ) {

                cards[i2].textContent =
                  picks[i2];

                cards[i2].classList.remove(
                  "popped"
                );

                cards[i2].classList.add(
                  "settled"
                );

                void cards[i2]
                  .offsetWidth;

                cards[i2].classList.add(
                  "popped"
                );

              }


              playFinalChord();


              setTimeout(
                function () {

                  if (actionsShown)
                    return;

                  actionsShown = true;

                  canClose = true;

                  stageActions.classList.add(
                    "show"
                  );

                },
                220
              );


            } else {

              if (
                now - lastSwitch >=
                switchInterval
              ) {

                lastSwitch = now;


                for (
                  var j = 0;
                  j < n;
                  j++
                ) {

                  cards[j].textContent =
                    students[
                      Math.floor(
                        Math.random() *
                        students.length
                      )
                    ];

                }


                playTick();

              }

            }


            requestAnimationFrame(
              frame
            );


          } else {

            if (
              elapsed >=
              rollDuration +
              popDuration
            ) {

              finishDraw();

            } else {

              requestAnimationFrame(
                frame
              );

            }

          }


        } catch (err) {

          console.error(
            "[动画错误]",
            err
          );

          resetDrawState();

        }

      }


      requestAnimationFrame(
        frame
      );


    } catch (err) {

      console.error(
        "[抽取错误]",
        err
      );

      resetDrawState();

      toast(
        "抽取出错：" +
        (
          err &&
          err.message
            ? err.message
            : err
        )
      );

    }

  }


  function resetDrawState() {

    drawing = false;

    canClose = false;

    drawBtn.disabled =
      false;

    drawBtn.textContent =
      "开 始 抽 取";

    stage.classList.remove(
      "show"
    );

    stageActions.classList.remove(
      "show"
    );

    syncCountUI();

  }


  function finishDraw() {

    if (!canClose) {

      canClose = true;

      stageActions.classList.add(
        "show"
      );

    }


    drawing = false;

    drawBtn.disabled =
      false;

    drawBtn.textContent =
      "开 始 抽 取";

    syncCountUI();

  }


  /* ================= 关闭舞台 ================= */

  function closeStage() {

    if (!canClose)
      return;

    canClose = false;

    stage.classList.remove(
      "show"
    );

    stageActions.classList.remove(
      "show"
    );


    setTimeout(
      function () {

        if (
          !stage.classList.contains(
            "show"
          )
        )

          board.innerHTML = "";

      },
      420
    );

  }


  /* ================= 按钮事件 ================= */

  backBtn.addEventListener(
    "click",
    function (e) {

      e.stopPropagation();

      if (drawing)
        return;

      closeStage();

    }
  );


  againBtn.addEventListener(
    "click",
    function (e) {

      e.stopPropagation();

      if (drawing)
        return;

      startDraw(
        lastDrawCount
      );

    }
  );


  stage.addEventListener(
    "click",
    closeStage
  );


  document.addEventListener(
    "keydown",
    function (e) {

      if (e.key === "Escape") {

        closeStage();

        return;

      }


      if (
        e.key === " " &&
        e.target.tagName !== "INPUT" &&
        e.target.tagName !== "BUTTON"
      ) {

        e.preventDefault();


        if (
          stage.classList.contains(
            "show"
          )
        ) {

          if (canClose)
            closeStage();

        } else {

          startDraw();

        }

      }

    }
  );


  drawBtn.addEventListener(
    "click",
    function () {

      startDraw();

    }
  );


  /* ================= 初始化 ================= */

  syncCountUI();


  /* 自动读取对应班级的名单文件 */

  if (
    location.protocol !==
    "file:"
  ) {

    fetch(
      targetFile +
      "?t=" +
      Date.now(),
      {
        cache: "no-store"
      }
    )

      .then(
        function (res) {

          if (!res.ok)

            throw new Error(
              "HTTP " +
              res.status
            );

          return res.arrayBuffer();

        }
      )

      .then(
        function (buf) {

          var names =
            parseNames(
              decodeBuffer(buf)
            );

          if (!names.length)

            throw new Error(
              "空文件"
            );

          onNamesLoaded(
            names,
            targetFile +
            "（自动读取）"
          );

        }
      )

      .catch(
        function (err) {

          console.log(
            "[init] 自动读取 " +
            targetFile +
            " 失败(请手动选择):",
            err.message
          );

          /* 自动读取失败时，更新提示文案 */

          if (uploadTitle) {

            uploadTitle.textContent =
              "点击载入名单文件";

          }

          if (uploadSub) {

            uploadSub.innerHTML =
              "未能自动读取 <b>" +
              targetFile +
              "</b>，请手动选择（每行一个名字）";

          }

        }
      );

  }

})();

</script>

</body>
